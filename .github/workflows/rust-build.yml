name: Rust build

on:
  push:
    branches: ["master"]
    paths:
      - "src/**"
      - "tests/**"
      - "ci/**"
      - "Cargo.*"
      - "rustfmt.toml"
      - ".github/**"
  pull_request:
    branches: ["master"]
    paths:
      - "src/**"
      - "tests/**"
      - "ci/**"
      - "Cargo.*"
      - "rustfmt.toml"
      - ".github/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings" # Fail compilation on any warnings

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: clippy
          override: true

      - name: Build
        run: cargo build --verbose

      - name: Check formatting
        run: cargo fmt --check

      - name: Run lints
        run: cargo clippy --all-targets -- -D clippy::all

  mount-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Prepare mount tests
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs
          sudo modprobe -a loop btrfs
          uname -a
          mkfs.btrfs --version

      - name: Run mount tests
        run: bash ci/test-mounts.sh --nocapture
